#
# Confinement rules for autonomous LLM agents (policy ID "llm-agent" in
# Beefile). Build with:
#   shirudo bpm build upatches/app-sandbox --version 1.0.0 \
#       --rodata-input sandbox=upatches/app-sandbox/llm-agent.toml \
#       --keys-dir <keys>

[networks]
# Instance metadata of AWS, Azure, GCP and OpenStack at 169.254.169.254,
# the ECS task and EKS Pod Identity credential endpoints, Alibaba Cloud
# and Oracle Cloud.
cloud_imds = [
	"169.254.169.254/32",
	"fd00:ec2::254/128",
	"169.254.170.2/32",
	"169.254.170.23/32",
	"fd00:ec2::23/128",
	"100.100.100.200/32",
	"192.0.0.192/32",
]

[sandbox.llm-agent]
families = ["inet", "inet6", "unix"]
deny_ptrace = true

[sandbox.llm-agent.deny]
network = ["@cloud_imds"]
create = [
	"*.pem",
	"id_rsa*",
	"id_ed25519*",
	"authorized_keys",
]
rename = [
	"*.pem",
	"id_rsa*",
	"id_ed25519*",
	".env*",
	"*credentials*",
	"token",
	"authorized_keys",
]
read = [
	"*.pem",
	"id_rsa*",
	"id_ed25519*",
	".env*",
	"*credentials*",
	"token",
]
write = [
	"*.pem",
	"id_rsa*",
	"id_ed25519*",
	"authorized_keys",
]
unix = [
	"docker.sock",
	"*/docker.sock",
	"*containerd*",
	"crio.sock",
]
